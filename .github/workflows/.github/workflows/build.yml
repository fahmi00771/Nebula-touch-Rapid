name: Build Nebula APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          echo "=== DEBUG: Found ZIP: ${ZIP_FILE:-NONE} ==="
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          echo "=== DEBUG: Extracted files (up to depth 4) ==="
          find project -maxdepth 4 -type f | head -n 100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          echo "=== DEBUG: Building :app:assembleDebug ==="
          gradle -p project --no-daemon :app:assembleDebug
          echo "=== DEBUG: All built APK files ==="
          find project -path "*/build/outputs/apk/*.apk" -o -path "*/build/outputs/apk/*/*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-Rapid-Touch-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
